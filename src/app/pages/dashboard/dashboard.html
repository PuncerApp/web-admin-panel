<h2 class="title">Admin Dashboard</h2>

<div class="cards">
  <div class="card total">
    <h3>Total Owners</h3>
    <p>{{ total }}</p>
  </div>

  <div class="card pending">
    <h3>Pending</h3>
    <p>{{ pending }}</p>
  </div>

  <div class="card approved">
    <h3>Approved</h3>
    <p>{{ approved }}</p>
  </div>

  <div class="card rejected">
    <h3>Rejected</h3>
    <p>{{ rejected }}</p>
  </div>
</div>
